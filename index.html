<!DOCTYPE html>
<html>
<head>
    <title>cadastro</title>
</head>
<body>
    
    <h2>cadastro</h2>

    <input type="text" id="nome"placeholder="nome">
    <input type="number" id="idade"placeholder="idade">
    <input type="text" id="curso"placeholder="curso">

    <button onclick="enviar()">enviar</button>

    <script>
function enviar(){

const dados = {
    nome:Document.getElementByld("nome").value,
    idade:Document.getElementByld("idade").value,
    curso:Document.getElementByld("curso").value
};

fetch("https://script.google.com/macros/s/AKfycbzhFSlzHhaHUvxTyqcHnphfP-ztwIsZ2J7A1Avxu5AK7vMdgEzMLk2EuPC1DOGeerCTbA/exec",{
    method:"POST",
    body: JSON.stringify(dados)
})
.then(res =>res_text())
.then(resposta=> {
    alert("Dados enviados!");
    console.log(resposta);
});


}

    </script>
</body>
</html>
